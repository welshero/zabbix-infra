version: '3.5'

services:
  postgres-server:
     postgres:13
    container_name: zabbix-postgres
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=CAMBIAR_EN_PRODUCCION
      - POSTGRES_DB=zabbix
    volumes:
      - ./zbx_env/var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      zabbix-net:
        ipv4_address: 172.20.0.11
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=CAMBIAR_EN_PRODUCCION
      - POSTGRES_DB=zabbix
    ports:
      - "10051:10051"
    networks:
      zabbix-net:
        ipv4_address: 172.20.0.10
    depends_on:
      - postgres-server
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-web
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=CAMBIAR_EN_PRODUCCION
      - POSTGRES_DB=zabbix
      - PHP_TZ=America/Argentina/Buenos_Aires
    ports:
      - "8081:8080"
    networks:
      zabbix-net:
        ipv4_address: 172.20.0.12
    depends_on:
      - postgres-server
      - zabbix-server
    restart: unless-stopped

networks:
  zabbix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
